name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{secrets.DOCKERUSERNAME }}
        password: ${{secrets.DOCKERHUBTOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERUSERNAME }}/myapp:latest
    - name: Deploy to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVERHOST }}
        username: ${{ secrets.SERVERUSER }}
        key: ${{ secrets.DEVOPS_GOURAV }}
        script: |
          docker pull ${{ secrets.DOCKERUSERNAME }}/myapp:latest
          docker stop devops_project-web-1 || true
          docker rm devops_project-web-1 || true
          docker run -d --name devops_project-web-1 -p 5000:5000 ${{ secrets.DOCKERUSERNAME }}/myapp:latest
